<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Sidebar Keeper settings panel</title>
  <desc id="desc">A dark Sidebar Keeper settings panel with toggles, target buttons, and a status row.</desc>
  <rect width="960" height="640" rx="22" fill="#f6f8fb"/>
  <g transform="translate(235 54)">
    <rect width="490" height="532" rx="22" fill="#202124"/>
    <line x1="18" y1="84" x2="472" y2="84" stroke="#343942"/>
    <circle cx="30" cy="38" r="7" fill="#10b981"/>
    <text x="50" y="49" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">Sidebar Keeper 1.0.0</text>
    <text x="315" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">?</text>
    <text x="358" y="50" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">☾</text>
    <rect x="391" y="16" width="40" height="40" rx="9" fill="#0f766e"/>
    <text x="411" y="44" text-anchor="middle" fill="#99f6e4" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">♙</text>
    <text x="452" y="49" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30">×</text>
    <text x="338" y="128" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">右侧工作面板</text>
    <text x="18" y="182" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">切换对话时保持打开</text>
    <rect x="394" y="162" width="58" height="36" rx="18" fill="#0d9488"/>
    <circle cx="434" cy="180" r="15" fill="#ffffff"/>
    <text x="18" y="235" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">一次只保留一个右侧标签</text>
    <rect x="394" y="215" width="58" height="36" rx="18" fill="#0d9488"/>
    <circle cx="434" cy="233" r="15" fill="#ffffff"/>
    <text x="382" y="291" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">打开后显示</text>
    <g transform="translate(18 316)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">
      <rect width="104" height="44" rx="8" fill="#0d9488"/>
      <text x="52" y="29" text-anchor="middle" fill="#ffffff">只打开</text>
      <rect x="112" width="104" height="44" rx="8" fill="#25272b" stroke="#46505d"/>
      <text x="164" y="29" text-anchor="middle" fill="#cbd5e1">侧边聊天</text>
      <rect x="224" width="104" height="44" rx="8" fill="#25272b" stroke="#46505d"/>
      <text x="276" y="29" text-anchor="middle" fill="#cbd5e1">浏览器</text>
      <rect x="336" width="104" height="44" rx="8" fill="#25272b" stroke="#46505d"/>
      <text x="388" y="29" text-anchor="middle" fill="#cbd5e1">终端</text>
    </g>
    <rect x="18" y="404" width="434" height="42" rx="8" fill="#2b2d31"/>
    <circle cx="45" cy="425" r="6" fill="#10b981"/>
    <text x="62" y="431" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">只保持打开</text>
  </g>
</svg>
